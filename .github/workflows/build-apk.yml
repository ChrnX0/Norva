name: Compilar o APK

# Compila o instalador no próprio runner, em vez de na Expo.
#
# Dois motivos. A cota da Expo é limitada e o dono pediu para guardá-la para
# versão madura e OTA. E o APK da Expo sai com quatro arquiteturas — 110 MB, dos
# quais 47 são x86 e x86_64, que só existem em emulador. Aqui sai só arm64-v8a,
# que é o que qualquer celular dos últimos dez anos usa: 47 MB.
#
# O artefato é anexado ao release, que é de onde um celular consegue baixar.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Uma hora é folga generosa para uma compilação fria de NDK, e evita queimar
    # as seis horas padrão do GitHub quando algo trava.
    #
    # Mas o relógio não diagnostica nada: as duas primeiras execuções morreram
    # aqui, e a causa era falta de Metaspace, não lentidão. Um job cancelado por
    # tempo diz "cancelled" e some com o motivo. Por isso o passo de memória
    # abaixo e o caché que grava mesmo assim - o limite continua sendo teto, não
    # explicação.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # A primeira execução compila o NDK inteiro do React Native e leva perto
      # de uma hora. O caché guarda o que não muda entre commits - dependências
      # do Gradle e os objetos nativos já compilados - e a segunda execução
      # passa a levar minutos. A chave inclui o lockfile porque uma dependência
      # nova invalida o que estava compilado.
      #
      # Restaurar e gravar são passos separados de propósito: ver o passo
      # "Guardar o caché" no fim do arquivo.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            gradle-${{ runner.os }}-

      - name: Instalar as dependências
        run: npm ci

      - name: Gerar o projeto nativo
        run: npx expo prebuild --platform android --no-install

      # Memória para o Gradle, medida da máquina em vez de adivinhada.
      #
      # O template do React Native pede 512 MB de Metaspace, e a arquitetura
      # nova não cabe nisso: a execução de 21h encheu o Metaspace aos 26
      # minutos, ficou vinte minutos sem escrever uma linha e morreu no relógio.
      # Falha de memória usando o cronômetro como disfarce.
      #
      # A primeira correção acertou o diagnóstico e errou a dose: dei 6 GB de
      # heap lendo "16 GB" de um comentário que eu não conferi. A compilação
      # então foi longe - bundle, Kotlin, dex, tudo - e às 00:05 o **runner
      # inteiro** recebeu sinal de desligamento, que é o que acontece quando as
      # JVMs somadas passam do que a máquina tem. O Gradle não é a única: o
      # compilador do Kotlin, o R8 e o aapt2 sobem cada um a sua.
      #
      # Então aqui não se escolhe número: lê-se a RAM e tira-se metade, e o
      # `free -h` fica no log para o próximo não precisar adivinhar também.
      - name: Dar memória ao Gradle, na medida da máquina
        run: |
          nproc
          free -h

          TOTAL_MB=$(free -m | awk '/^Mem:/ {print $2}')
          HEAP_MB=$(( TOTAL_MB / 2 ))
          if [ "$HEAP_MB" -gt 4096 ]; then HEAP_MB=4096; fi
          if [ "$HEAP_MB" -lt 2048 ]; then HEAP_MB=2048; fi
          echo "máquina com ${TOTAL_MB} MB de RAM; heap do Gradle: ${HEAP_MB} MB"

          cd android
          JVMARGS="-Xmx${HEAP_MB}m -XX:MaxMetaspaceSize=1g"
          sed -i "s/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=$JVMARGS/" gradle.properties

          # O prebuild gera este arquivo a cada execução. Se o Expo renomear a
          # chave, o sed não casa - e sem esta conferência a compilação voltaria
          # a morrer igual daqui a meses, sem pista nenhuma.
          grep -q "^org.gradle.jvmargs=$JVMARGS$" gradle.properties

          # A JVM do Kotlin é a segunda maior da soma, e o padrão dela é generoso.
          #
          # O `printf` começa com uma quebra de linha porque o arquivo gerado
          # **termina sem uma**: um `echo >>` cola o texto no fim da última
          # linha e produz `...watchedDirectories=[]kotlin.daemon.jvmargs=-Xmx1g`,
          # que estraga as duas propriedades e não reclama. Foi assim na
          # primeira tentativa, e só apareceu porque este passo foi rodado
          # contra o `gradle.properties` de verdade antes de subir.
          printf '\n%s\n' "kotlin.daemon.jvmargs=-Xmx1g" >> gradle.properties
          grep -q '^kotlin.daemon.jvmargs=-Xmx1g$' gradle.properties

          grep -E '^(org.gradle.jvmargs|kotlin.daemon.jvmargs)=' gradle.properties

      - name: Compilar, só arm64
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Conferir que o que saiu instala
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"

          # Assinatura: um APK sem ela não instala, e o erro no celular não
          # explica nada. A ferramenta oficial responde antes de publicarmos.
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$SIGNER" verify --verbose "$APK" | tee /tmp/sig.txt
          grep -q "^Verifies" /tmp/sig.txt

          # E o bundle tem de estar dentro: um APK sem JS abre numa tela branca.
          unzip -l "$APK" | grep -q assets/index.android.bundle

          # Uma arquitetura só, senão o ganho de tamanho se perdeu no caminho.
          test "$(unzip -l "$APK" | grep -oE 'lib/[a-z0-9_-]+/' | sort -u | wc -l)" -eq 1

          cp "$APK" norva-arm64.apk

      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag sai do app.json, e nunca de um texto escrito à mão.
          #
          # Era fixa em `apk-0.1.0`, então o release seguia dizendo 0.1.0
          # enquanto o conteúdo mudava - e do celular isso é indistinguível da
          # primeira versão. Quem baixa não lê o diff; lê o título.
          VERSION="$(node -p "require('./app.json').expo.version")"
          TAG="apk-$VERSION"
          echo "publicando $TAG"

          gh release upload "$TAG" norva-arm64.apk --clobber

          # A pagina tem de dizer o que carrega. Trocar o arquivo sem trocar o
          # texto deixa o release parecendo a primeira versao para sempre, e
          # quem abre no celular nao tem como saber que baixou o novo.
          {
            echo "Instalador de teste do NORVA para Android."
            echo
            echo "**Baixe \`norva-arm64.apk\`** - 47 MB, compilado neste repositorio."
            echo "O \`norva.apk\` grande vem da Expo e carrega duas arquiteturas"
            echo "que so existem em emulador."
            echo
            echo "**Como instalar:** baixe pelo proprio celular. O Android pede"
            echo "permissao para instalar fora da Play Store - e normal em"
            echo "aplicativo de teste, e e uma vez so."
            echo
            echo "**Se ja tiver a versao da Expo instalada:** desinstale antes."
            echo "As duas sao assinadas com chaves diferentes e o Android recusa"
            echo "instalar uma por cima da outra - e desinstalar apaga os dados."
            echo
            echo "---"
            echo "Compilado de \`$(git rev-parse --short HEAD)\` - $(date -u +'%d/%m/%Y %H:%M UTC')"
          } > notas.md

          gh release edit "$TAG" --notes-file notas.md
          echo "no release: $(gh release view "$TAG" --json url -q .url)"

      # Guardar mesmo quando a compilação não terminou.
      #
      # O `actions/cache` inteiro só grava no fim de um job que terminou, e um
      # job morto por timeout nunca grava. Então a execução seguinte também
      # começava fria, e também morria no relógio: o caché que faria a
      # compilação caber na hora só existiria se ela já tivesse cabido. Era um
      # nó, e ele já custou duas horas de runner.
      #
      # O alcance disto tem borda, e ela já foi vista: `always()` cobre passo
      # que falha e job cancelado, mas não cobre a máquina sumir. Quando o
      # runner recebeu sinal de desligamento, este passo também foi pulado -
      # nada roda numa máquina que morreu. Contra isso o que vale é não estourar
      # a memória dela, que é o passo acima.
      #
      # A chave leva o `run_id` porque entrada de caché não se sobrescreve -
      # sem isso a primeira gravação parcial seria a única, para sempre.
      - name: Guardar o caché, tenha dado certo ou não
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
