name: CI

# A barra, proporcional ao que mudou — decisão do dono, 5 de setembro.
#
# Antes, todo push rodava tudo: quatro jobs, um deles com `mutate` (seis minutos)
# e outro subindo Chromium. Isso nasceu certo e virou atrito: commit de documento
# esperava dez minutos para provar nada, e push novo não cancelava o anterior.
#
# Agora são duas camadas. **Rápida** roda sempre e responde em ~2 min: tipos,
# lint, testes e o pacote. **Pesada** — mutação, navegador, banco e portão — roda
# quando a coisa vai para `main`, ou quando alguém pede pelo botão. Nada foi
# apagado: só saiu do caminho de quem está trabalhando.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.shots/**']
  pull_request:
    # `ready_for_review` entra na lista porque é ele que liga a bateria pesada.
    # Sem ele, sair de rascunho não dispara nada, e a pesada só rodaria no push
    # seguinte — ou nunca, se não houver push seguinte.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', '.shots/**']
  workflow_dispatch:

# A pesada NÃO roda em PR rascunho — e isto é sobre dinheiro do dono.
#
# A condição era "PR cuja base é `main`", e um PR de trabalho tem a base `main`
# desde o primeiro commit: então cada push meu disparava mutação (16 min),
# navegador (11 min), banco e portão. Numa manhã de doze pushes são mais de três
# horas de runner para provar doze vezes a mesma coisa, e o dono já tinha dito
# *"cuidado para nao queimar todos os creditos"*.
#
# Rascunho é a palavra que o próprio GitHub tem para "ainda estou trabalhando".
# A pesada volta sozinha no instante em que o PR é marcado como pronto para
# revisão — que é quando ela importa — e continua disponível pelo botão.
#
# A rápida (tipos, lint, teste, pacote) continua em todo push: ela custa dois
# minutos e é a que pega o erro enquanto ele ainda é barato.

# Push novo mata a corrida velha do mesmo ramo. Antes, três pushes seguidos
# mantinham três baterias inteiras vivas ao mesmo tempo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapido:
    name: tipos, testes e pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: O motor de custo
        run: npm test

      # Compilar prova consistência; empacotar prova que chega num telefone.
      - name: Pacote Android
        run: npx expo export --platform android
        env:
          EXPO_NO_TELEMETRY: '1'

  # ---------------------------------------------------------------------------
  # Daqui para baixo: só para `main` ou sob demanda.
  # ---------------------------------------------------------------------------

  mutacao:
    name: a suíte morde?
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || (github.base_ref == 'main' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Suíte verde diz que os exemplos passaram, não que a regra está
      # protegida. Isto quebra o código de propósito, um defeito por vez.
      - name: Mutação
        run: npm run mutate

  navegador:
    name: o app dirigido como uma pessoa dirige
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || (github.base_ref == 'main' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Ponta a ponta
        run: npm run e2e
        env:
          EXPO_NO_TELEMETRY: '1'

  esquema:
    name: o banco cumpre o que promete
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || (github.base_ref == 'main' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O script sobe um Postgres descartável próprio, então precisa dos
      # binários e não de um serviço rodando.
      - name: Achar os binários do Postgres
        run: echo "PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_ENV"
      - name: As treze garantias
        run: npm run db:verify

  portao:
    name: proofgate
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || (github.base_ref == 'main' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      # O portão lê o diff contra a base, então precisa do histórico.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Portão de entrega
        run: bash .proofgate/verify.sh
