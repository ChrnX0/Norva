name: Publicar o APK

# Põe o instalador num lugar de onde um celular consegue baixar.
#
# O link direto da Expo termina numa URL assinada da Amazon que devolve 109 MiB
# como download bruto, e navegador de celular costuma desistir disso em silêncio.
# Um release do GitHub serve o mesmo arquivo de um endereço estável, que o
# Android trata como um download normal.
#
# O arquivo não pode ir num commit: o GitHub recusa acima de 100 MiB. Como
# anexo de release ele cabe (o limite lá é 2 GB), e quem baixa é o runner, não
# o repositório - o binário nunca entra no histórico.
#
# O gatilho é manual, e isso é cicatriz.
#
# Ele era `pull_request` com `paths: .github/apk-release.txt`, na crença de que
# só rodaria quando esse arquivo mudasse. A documentação do GitHub diz o
# contrário, com todas as letras: *"For pull requests, the filter is evaluated
# against the three-dot diff of the pull request base and head"*. Como o arquivo
# entrou no PR uma vez, ele passou a casar em toda sincronização: das 40
# execuções deste workflow, **37 rodaram sobre commits que não tocaram o
# arquivo**. A execução 40 rodou às 01:45 num commit que só mexia em
# documentação, baixou de novo o artefato da Expo (26 commits atrás daquele
# head) e o anexou por cima do release `apk-0.2.0`, ao lado do APK novo.
#
# O resultado é o pior tipo de defeito de entrega: dois arquivos sob a mesma
# **tag**, com códigos diferentes. Eles nem se anunciam igual - `versionName`
# 0.1.0 contra 0.2.0 - mas os dois trazem `versionCode 1`, que é o campo pelo
# qual o Android decide se há atualização. Quem baixa o maior instala um app sem
# as telas de produção, estoque e transferência. Um `paths-ignore` não conserta
# isso; o evento é que está errado.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler o pedido
        id: request
        run: |
          # Primeira linha não vazia que não é comentário: a URL do artefato.
          URL="$(grep -vE '^\s*(#|$)' .github/apk-release.txt | head -1)"
          # A versão manda, não o comentário do arquivo: uma tag escrita à mão
          # envelhece calada e o release passa a mentir sobre o que carrega.
          TAG="apk-$(node -p "require('./app.json').expo.version")"
          [ -n "$URL" ] || { echo "sem URL em .github/apk-release.txt"; exit 1; }

          # De qual commit este artefato saiu - e ele NÃO é o HEAD do
          # repositório. O release dizia "compilado de <HEAD>" enquanto
          # carregava um build da Expo de 26 commits antes: a nota mentia sobre
          # o binário que estava logo abaixo dela. Então o commit vem escrito no
          # pedido, e sem ele não se publica.
          # O `|| true` não é desleixo: com `set -e`, um `grep` sem casar mata o
          # passo antes da mensagem, e o log diria só "Process completed with
          # exit code 1". A checagem explícita abaixo é que deve falar.
          COMMIT="$(grep -oE '^#[[:space:]]*commit:[[:space:]]*[0-9a-f]{7,40}' .github/apk-release.txt | head -1 | grep -oE '[0-9a-f]{7,40}$' || true)"
          [ -n "$COMMIT" ] || {
            echo "falta a linha '# commit: <sha>' em .github/apk-release.txt"
            echo "sem ela o release não sabe dizer que código está publicando"
            exit 1
          }

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-apk-${{ github.run_number }}}" >> "$GITHUB_OUTPUT"

      - name: Baixar o APK da Expo
        run: |
          echo "baixando ${{ steps.request.outputs.url }}"
          curl -fL --retry 3 --retry-delay 5 -o norva.apk "${{ steps.request.outputs.url }}"

          # Uma página de erro também sai com 200, então o que vale é o conteúdo.
          unzip -l norva.apk | grep -q AndroidManifest.xml || {
            echo "o que baixou não é um APK"; exit 1;
          }
          ls -lh norva.apk

      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          NOTES=$(cat <<'NOTES'
          Instalador de teste do NORVA para Android.

          **Como instalar:** baixe `norva.apk` abaixo pelo próprio celular. O
          Android vai pedir permissão para instalar de fora da Play Store — é
          normal em aplicativo de teste, e é uma vez só.

          Build interno da Expo, com todas as arquiteturas no mesmo arquivo —
          por isso é grande. A versão de loja sai bem menor.
          NOTES
          )

          # De qual código este arquivo saiu - o commit do artefato, nunca o
          # HEAD de quem disparou. Sem isto, dois arquivos com a mesma tag são
          # indistinguíveis, e a pergunta "eu já estou com o novo?" não tem
          # resposta - foi exatamente assim que um APK de 26 commits atrás
          # passou a semana anunciado como a versão de hoje.
          NOTES="$NOTES

          ---
          Compilado de \`${{ steps.request.outputs.commit }}\` · publicado em $(date -u +'%d/%m/%Y %H:%M UTC')"


          gh release create "$TAG" norva.apk \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "NORVA $TAG" \
            --prerelease \
            --notes "$NOTES" \
          || gh release upload "$TAG" norva.apk --clobber

          echo "release: $(gh release view "$TAG" --json url -q .url)"
