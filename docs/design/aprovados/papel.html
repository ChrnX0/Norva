<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:412px;height:300px;background:#faf7f2;color:#221f1b;
 font-family:Georgia,"Times New Roman",serif;overflow:hidden}
.wrap{padding:22px 24px}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#a2988a;
 font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif}
h1{font-size:29px;line-height:1.08;margin-top:8px;font-weight:400}
h1 b{font-weight:700}
svg{display:block;width:100%;height:auto;margin-top:10px}

/* A fumaça sobe e some. Seis segundos, que é o tempo de uma respiração longa —
   qualquer coisa mais rápida vira nervosismo numa tela que fica aberta o dia. */
.fumaca{animation:subir 6s ease-in-out infinite}
@keyframes subir{
  0%{transform:translateY(6px);opacity:0}
  25%{opacity:.9}
  100%{transform:translateY(-16px);opacity:0}
}
.fumaca.b{animation-delay:2s}
.fumaca.c{animation-delay:4s}

/* O sol gira uma volta a cada trinta segundos: percebe-se se você olhar,
   não se percebe se você estiver trabalhando. */
.sol{transform-origin:336px 30px;animation:girar 30s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* O floco da câmara fria, mais devagar ainda. */
.floco{transform-origin:151px 58px;animation:girar 48s linear infinite}

/* O picolé do meio enche: é a produção do dia entrando. Ele para cheio -
   encher e esvaziar em ciclo seria a fábrica desfazendo o que fez. */
.enche{animation:encher 3.2s cubic-bezier(.22,1,.36,1) .6s both}
@keyframes encher{from{transform:translateY(34px)}to{transform:translateY(0)}}

/* A caixa entra pela direita, uma vez, como a expedição do dia. */
.caixa{animation:entrar 1.4s cubic-bezier(.22,1,.36,1) 2.4s both}
@keyframes entrar{from{transform:translateX(46px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
