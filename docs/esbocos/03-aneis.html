<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
body{background:#000;color:#fff}
.wrap{padding:24px 20px 120px}
.top{display:flex;justify-content:space-between;align-items:center}
.top .d{font-size:13px;color:#8a8a8e}
.top .n{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ringwrap{display:flex;align-items:center;gap:22px;margin-top:26px}
.stat b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em}

.pill{background:#1c1c1e;border-radius:18px;padding:16px 18px;margin-top:12px}

.w{background:linear-gradient(150deg,#0a3d62,#1e6091 55%,#f6b26b);border-radius:22px;padding:18px;margin-top:12px;position:relative;overflow:hidden}
.w .t{font-size:46px;font-weight:700;letter-spacing:-.03em}

.cta{position:fixed;bottom:96px;left:20px;right:20px;height:54px;border-radius:16px;background:#fff;color:#000;font-weight:650;display:flex;align-items:center;justify-content:center}
.tab{background:#0a0a0acc;border-top:1px solid #1c1c1e;color:#6a6a6e;backdrop-filter:blur(10px)}.tab b{color:#fff}
