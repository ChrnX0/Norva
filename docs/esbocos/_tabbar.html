<!-- Barra de abas com os ícones do app. Troque apenas as cores nas variáveis. -->
<style>
.tabbar{position:fixed;bottom:0;left:0;right:0;height:78px;display:flex;align-items:center;
 justify-content:space-around;padding-bottom:14px;font-size:11px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none}
.tabbar svg{display:block}
</style>
<div class="tabbar" style="background:var(--tabbg,#101014);border-top:1px solid var(--tabline,#23232b);color:var(--tabink,#6d6d78)">

    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
    <span style="color:var(--tabon,#8fb6d8);font-weight:600">Início</span></a>
  <a style="color:var(--c2,#e2a283)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="14" rx="6"/><path d="M12 16.5v5"/></svg>
    <span style="color:var(--tabink,#6d6d78)">Produção</span></a>
  <a style="color:var(--c3,#ab9bdd)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5h11v9H2z"/><path d="M13 11h4l3.5 3.5v2H13z"/><circle cx="6.5" cy="18.5" r="1.9"/><circle cx="16.5" cy="18.5" r="1.9"/></svg>
